<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shake&amp;Betray 制作過程 — Process</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1714;
      --paper: #f5f0e8;
      --accent: #c84b2f;
      --muted: #8a8278;
      --border: #d4cdc3;
    }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.6;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 4rem;
      border-bottom: 1px solid var(--border);
      background: rgba(245,240,232,0.85);
      backdrop-filter: blur(10px);
    }
    .nav-logo {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.1rem; letter-spacing: 0.1em;
      text-decoration: none; color: var(--ink);
    }
    .nav-back {
      font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); text-decoration: none; transition: color 0.2s;
    }
    .nav-back:hover { color: var(--ink); }
    .nav-back::before { content: '← '; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 8rem 2rem 6rem;
      position: relative; z-index: 1;
    }
    .game-banner {
      width: 100%;
      aspect-ratio: 16 / 6;
      background: #1a1714;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 3rem;
    }
    .game-banner img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .game-meta {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .game-title {
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.15;
    }
    .game-genre {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.25rem 0.75rem;
      white-space: nowrap;
    }
    .game-desc, .process-body p {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.9;
      max-width: 720px;
      margin-bottom: 1.5rem;
    }
    .process-body h2 {
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      margin: 3rem 0 1rem;
    }
    .process-body img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
    }
    .btn-play {
      display: inline-block;
      padding: 0.9rem 2.8rem;
      background: var(--accent);
      color: white;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.25s;
    }
    .btn-play:hover { background: #a33a20; }
    .btn-back {
      display: inline-block;
      margin-left: 1rem;
      padding: 0.9rem 2rem;
      border: 1.5px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-back:hover { border-color: var(--ink); color: var(--ink); }
    .divider {
      border: none; border-top: 1px solid var(--border);
      margin: 3rem 0;
    }
    @media (max-width: 600px) {
      nav { padding: 1rem 1.5rem; }
      main { padding: 6rem 1.2rem 4rem; }
      .btn-back { margin-left: 0; margin-top: 1rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">陽以前</a>
    <a href="index.html#process" class="nav-back">Process</a>
  </nav>

  <main>
    <div class="game-banner">
      <img src="images/shakeandbetray-banner.png" alt="Shake&amp;Betray 制作過程">
    </div>

    <div class="game-meta">
      <h1 class="game-title">Shake&amp;Betray 制作過程</h1>
      <span class="game-genre">PROCESS</span>
    </div>

    <p class="game-desc">
      どういう考えでゲームを作り始めたのか、どんな順番で形にしていったのか<br>
      
    </p>

    <a href="shakeandbetray.html" class="btn-play">View Work</a>
    <a href="index.html#process" class="btn-back">← Back</a>

    <hr class="divider">

    <div class="process-body">
      <h2>きっかけ</h2>
      <p>
        制作のきっかけ
      </p>

      <h2>作り方</h2>
      <p>
      制作手順
      </p>
      <img src="images/nabari.png" alt="制作過程の画像">

      <h2>振り返り</h2>
      <p>
        完成後の振り返り
      </p>
    </div>
  </main>

</body>
</html>
